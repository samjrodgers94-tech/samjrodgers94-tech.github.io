<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Rodgers — plant photography</title>
<meta name="description" content="Plant and garden photography by Sam Rodgers.">

<meta property="og:title" content="Sam Rodgers — plant photography">
<meta property="og:description" content="Plant and garden photography by Sam Rodgers.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/hero.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">

<style>
  :root{
    --black:#0A0A0A;
    --panel:#131313;
    --white:#F2F2F0;
    --grey:#8C8C88;
    --line:rgba(242,242,240,.16);
    --display:"Newsreader",Georgia,serif;
    --text:"Archivo","Helvetica Neue",Arial,sans-serif;
    --bar:64px;
    --gap:clamp(8px,1.2vw,16px);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--black);color:var(--white);
    font-family:var(--text);font-weight:300;font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:1px solid var(--white);outline-offset:4px}

  .wrap{width:min(1320px,90vw);margin-inline:auto}

  .label{
    font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;
    color:var(--grey);
  }
  .rule{display:inline-block;width:42px;height:1px;background:var(--line);vertical-align:middle}

  /* ---------- top bar ---------- */
  .bar{
    position:fixed;top:0;left:0;right:0;z-index:60;height:var(--bar);
    display:flex;align-items:center;
    background:var(--black);border-bottom:1px solid rgba(242,242,240,.08);
  }
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;width:min(1320px,92vw)}
  .mark{font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:400}
  .bar nav{display:flex;gap:clamp(16px,2.6vw,34px)}
  .bar nav a{font-size:12.5px;color:#CFCFCB}
  .bar nav a:hover{color:var(--white)}

  /* ---------- hero ---------- */
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--panel)}
  .hero>img{width:100%;height:100%;object-fit:cover}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,rgba(10,10,10,.86) 0%,rgba(10,10,10,.55) 42%,rgba(10,10,10,.15) 78%);
  }
  .hero-body{position:absolute;inset:var(--bar) 0 0;z-index:2;display:flex;align-items:center}
  .hero-body .wrap{max-width:min(1320px,90vw)}
  .eyebrow{margin:0 0 clamp(20px,3.5vh,34px)}
  h1{
    font-family:var(--display);font-weight:200;
    font-size:clamp(2.9rem,6.4vw,5.1rem);line-height:1.04;letter-spacing:-.015em;
    margin:0;
  }
  h1 span{display:block}
  .hero-note{
    margin:clamp(22px,3.5vh,34px) 0 0;max-width:30ch;color:#C8C8C4;font-size:14px;line-height:1.75;
    padding-top:22px;position:relative;
  }
  .hero-note::before{content:"";position:absolute;top:0;left:0;width:42px;height:1px;background:var(--line)}
  .hero-foot{
    position:absolute;left:0;right:0;bottom:clamp(20px,4vh,40px);z-index:3;
  }
  .hero-foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:2em}

  /* ---------- collection tiles ---------- */
  .tiles{padding:clamp(10px,1.6vw,18px) 0 0}
  .tiles .wrap{display:grid;gap:var(--gap);grid-template-columns:1fr}
  @media(min-width:760px){.tiles .wrap{grid-template-columns:repeat(3,1fr)}}
  .tile{display:block;cursor:pointer;border:0;padding:0;background:none;text-align:left;font:inherit;color:inherit;width:100%}
  .tile figure{margin:0;position:relative;aspect-ratio:16/10;background:var(--panel);overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:cover;filter:brightness(.72);transition:filter .5s ease}
  .tile:hover img,.tile:focus-visible img{filter:brightness(.95)}
  .tile .label{display:block;padding:14px 2px 0;color:var(--white)}
  .tile .count{color:var(--grey);letter-spacing:.22em}

  /* ---------- gallery ---------- */
  .gallery{padding:clamp(70px,11vh,130px) 0 0}
  .gallery-head{display:flex;flex-wrap:wrap;gap:1.4em;align-items:baseline;justify-content:space-between;margin-bottom:clamp(22px,4vh,40px)}
  .filters{display:flex;gap:.2em;flex-wrap:wrap;margin:0;padding:0}
  .filter{
    background:none;border:0;cursor:pointer;font:inherit;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);
    padding:.6em .95em;
  }
  .filter:hover{color:var(--white)}
  .filter[aria-pressed="true"]{color:var(--black);background:var(--white)}

  .grid{columns:1;column-gap:var(--gap)}
  @media(min-width:640px){.grid{columns:2}}
  @media(min-width:1060px){.grid{columns:3}}

  figure.shot{break-inside:avoid;margin:0 0 var(--gap);background:var(--panel)}
  figure.shot.is-hidden{display:none}
  .shot button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;color:inherit}
  .shot img{width:100%}
  .shot figcaption{display:flex;justify-content:space-between;gap:1.5em;padding:12px 2px 0}
  .shot .sp{font-family:var(--display);font-style:italic;font-size:14px;color:var(--white);letter-spacing:0;text-transform:none}
  .shot .pl{white-space:nowrap}

  .shot.missing button{
    aspect-ratio:var(--ar,4/5);display:grid;place-content:center;gap:8px;
    border:1px dashed var(--line);cursor:default;padding:1.5em;text-align:center;
  }
  .shot.missing img{display:none}
  .ph-name{font-size:11px;color:var(--grey);word-break:break-all}
  .ph-hint{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5E5E5B}
  .shot:not(.missing) .ph-name,.shot:not(.missing) .ph-hint{display:none}

  /* ---------- about ---------- */
  .about{padding:clamp(80px,14vh,160px) 0;margin-top:clamp(70px,11vh,130px);border-top:1px solid var(--line)}
  .about .wrap{display:grid;gap:clamp(28px,5vw,80px)}
  @media(min-width:880px){.about .wrap{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}
  .about h2{font-family:var(--display);font-weight:200;font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.1;margin:0}
  .about p{margin:0 0 1.3em;max-width:56ch;color:#C8C8C4;font-size:14.5px;line-height:1.8}
  .about p:last-child{margin-bottom:0}
  .ig{
    display:inline-flex;align-items:center;gap:.8em;margin-top:.6em;
    border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .ig:hover{border-color:var(--white)}
  .ig .handle{font-family:var(--display);font-size:20px;font-weight:300}
  .ig svg{width:17px;height:17px;flex:none}

  footer{border-top:1px solid var(--line);padding:28px 0 44px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:1.5em;justify-content:space-between;align-items:center}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:100;display:none;background:rgba(6,6,6,.97);
    padding:clamp(14px,3vw,44px);grid-template-rows:1fr auto;gap:18px}
  .lightbox.is-open{display:grid}
  .lightbox img{margin:auto;max-width:100%;max-height:100%;object-fit:contain}
  .lb-bar{display:flex;align-items:center;justify-content:space-between;gap:2em}
  .lb-bar .sp{font-family:var(--display);font-style:italic;font-size:15px}
  .lb-nav{display:flex;gap:8px}
  .lb-nav button,.lb-close{
    background:none;border:1px solid var(--line);color:var(--white);
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;
  }
  .lb-nav button:hover,.lb-close:hover{border-color:var(--white)}
  .lb-close{position:absolute;top:clamp(14px,3vw,44px);right:clamp(14px,3vw,44px)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="mark" href="#top">Sam Rodgers</a>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a id="navIg" href="https://www.instagram.com/samjrodgers_" target="_blank" rel="me noopener">Instagram</a>
    </nav>
  </div>
</div>

<header class="hero" id="top">
  <img id="heroImg" src="" alt="" onerror="this.style.display='none'">
  <div class="hero-body">
    <div class="wrap">
      <p class="eyebrow label" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p class="hero-note" id="heroNote"></p>
    </div>
  </div>
  <div class="hero-foot">
    <div class="wrap">
      <a class="label" href="#work">Scroll &nbsp;<span class="rule"></span></a>
      <span class="label" id="heroCorner"></span>
    </div>
  </div>
</header>

<main>
  <section class="tiles" aria-label="Collections">
    <div class="wrap" id="tiles"></div>
  </section>

  <section class="gallery" id="work">
    <div class="wrap">
      <div class="gallery-head">
        <p class="label" style="margin:0">Selected work</p>
        <div class="filters" id="filters" role="group" aria-label="Filter by collection"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap">
      <h2 id="aboutTitle"></h2>
      <div>
        <div id="aboutBody"></div>
        <a class="ig" id="aboutIg" href="https://www.instagram.com/samjrodgers_" target="_blank" rel="me noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
            <circle cx="12" cy="12" r="4.6"/>
            <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          <span class="handle" id="igHandle"></span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="label">© <span id="year"></span> Sam Rodgers</span>
    <a class="label" id="footIg" href="https://www.instagram.com/samjrodgers_" target="_blank" rel="me noopener">Instagram</a>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-bar">
    <span id="lbCaption" class="label"></span>
    <span class="lb-nav">
      <button id="lbPrev" aria-label="Previous photograph">‹</button>
      <button id="lbNext" aria-label="Next photograph">›</button>
    </span>
  </div>
</div>

<script>
/* ===========================================================
   Content lives in content/photos.json and content/site.json,
   edited via the CMS rather than here. The copies below are a
   fallback only, used when fetch can't run (e.g. opened via
   file:// instead of served over http).
   =========================================================== */
const FALLBACK_PHOTOS = [
  { file:"images/battleston-01.jpg", name:"Rhododendron 'Cynthia'",  place:"Battleston Hill", set:"Battleston Hill", ratio:"4/5" },
  { file:"images/battleston-02.jpg", name:"Magnolia campbellii",     place:"Battleston Hill", set:"Battleston Hill", ratio:"2/3" },
  { file:"images/battleston-03.jpg", name:"Acer palmatum",           place:"Battleston Hill", set:"Battleston Hill", ratio:"3/2" },
  { file:"images/battleston-04.jpg", name:"Camellia japonica",       place:"Battleston Hill", set:"Battleston Hill", ratio:"4/5" },

  { file:"images/woodland-01.jpg",   name:"Galanthus nivalis",       place:"Wisley",          set:"Woodland",        ratio:"3/2" },
  { file:"images/woodland-02.jpg",   name:"Helleborus × hybridus",   place:"Wisley",          set:"Woodland",        ratio:"4/5" },
  { file:"images/woodland-03.jpg",   name:"Anemone nemorosa",        place:"Wisley",          set:"Woodland",        ratio:"3/2" },
  { file:"images/woodland-04.jpg",   name:"Dryopteris affinis",      place:"Wisley",          set:"Woodland",        ratio:"2/3" },

  { file:"images/detail-01.jpg",     name:"Papaver somniferum",      place:"Trials field",    set:"Detail",          ratio:"4/5" },
  { file:"images/detail-02.jpg",     name:"Allium cristophii",       place:"Mixed border",    set:"Detail",          ratio:"4/5" },
  { file:"images/detail-03.jpg",     name:"Echeveria elegans",       place:"Glasshouse",      set:"Detail",          ratio:"3/2" },
  { file:"images/detail-04.jpg",     name:"Nepenthes sp.",           place:"Glasshouse",      set:"Detail",          ratio:"2/3" },
];

const FALLBACK_SITE = {
  headline: ["Light.", "Leaf.", "Season."],
  heroNote: "A year of close looking in the gardens at RHS Wisley, where I work the beds on Battleston Hill.",
  heroCorner: "A closer look",
  heroImage: "images/hero.jpg",
  aboutTitle: "The art of noticing",
  aboutBody: [
    "I'm a horticulturalist at RHS Wisley, responsible for Battleston Hill. The photographs come out of the same looking the job asks for — knowing when a flower is three days from its best, or when the low light finally reaches something that spends most of the day in shade.",
    "Shot on a Sony a7CR with a 24–105mm. Plant names follow the collection records; corrections are always welcome."
  ],
  instagram: "https://www.instagram.com/samjrodgers_"
};

Promise.all([
  fetch("content/photos.json").then(r => r.json()),
  fetch("content/site.json").then(r => r.json())
]).then(([photos, site]) => render(photos, site))
  .catch(err => {
    console.log("Could not fetch content/*.json (fetch doesn't work over file://) — showing built-in fallback content instead.", err);
    render(FALLBACK_PHOTOS, FALLBACK_SITE);
  });

function render(PHOTOS, SITE) {

const grid    = document.getElementById("grid");
const filters = document.getElementById("filters");
const tiles   = document.getElementById("tiles");
const sets    = [...new Set(PHOTOS.map(p => p.set))];
let visible = [];

/* --- site copy --- */
document.getElementById("eyebrow").textContent = sets.slice(0, 3).join(" / ");
document.getElementById("heroImg").src = SITE.heroImage;
document.getElementById("headline").innerHTML = SITE.headline.map(line => `<span>${line}</span>`).join("");
document.getElementById("heroNote").textContent = SITE.heroNote;
document.getElementById("heroCorner").textContent = SITE.heroCorner;
document.getElementById("aboutTitle").textContent = SITE.aboutTitle;
document.getElementById("aboutBody").innerHTML = SITE.aboutBody.map(p => `<p>${p}</p>`).join("");

const igHandle = "@" + SITE.instagram.replace(/\/$/, "").split("/").pop();
["navIg", "aboutIg", "footIg"].forEach(id => document.getElementById(id).href = SITE.instagram);
document.getElementById("igHandle").textContent = igHandle;

/* --- gallery --- */
PHOTOS.forEach((p, i) => {
  const fig = document.createElement("figure");
  fig.className = "shot";
  fig.dataset.set = p.set;
  fig.dataset.index = i;
  fig.style.setProperty("--ar", p.ratio || "4/5");
  fig.innerHTML = `
    <button type="button" aria-label="View ${p.name}">
      <img src="${p.file}" alt="${p.name} photographed at ${p.place}" loading="lazy">
      <span class="ph-name">${p.file}</span>
      <span class="ph-hint">Add this file</span>
    </button>
    <figcaption class="label"><span class="sp">${p.name}</span><span class="pl">${p.place}</span></figcaption>`;
  fig.querySelector("img").addEventListener("error", () => fig.classList.add("missing"));
  fig.querySelector("button").addEventListener("click", () => {
    if (!fig.classList.contains("missing")) open(i);
  });
  grid.appendChild(fig);
});

/* --- filters --- */
["All", ...sets].forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "filter";
  b.type = "button";
  b.textContent = s;
  b.dataset.set = s;
  b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  b.addEventListener("click", () => applyFilter(s));
  filters.appendChild(b);
});

function applyFilter(set){
  filters.querySelectorAll(".filter").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.set === set)));
  grid.querySelectorAll(".shot").forEach(f =>
    f.classList.toggle("is-hidden", set !== "All" && f.dataset.set !== set));
  refreshVisible();
}

/* --- collection tiles --- */
sets.forEach(s => {
  const first = PHOTOS.find(p => p.set === s);
  const n = PHOTOS.filter(p => p.set === s).length;
  const b = document.createElement("button");
  b.className = "tile";
  b.type = "button";
  b.innerHTML = `
    <figure><img src="${first.file}" alt="" loading="lazy" onerror="this.style.display='none'"></figure>
    <span class="label">${s}</span>
    <span class="label count">${n} photograph${n === 1 ? "" : "s"}</span>`;
  b.addEventListener("click", () => {
    applyFilter(s);
    document.getElementById("work").scrollIntoView({ behavior: "smooth" });
  });
  tiles.appendChild(b);
});

/* --- lightbox --- */
const box   = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCaption");
let pos = 0;

function refreshVisible(){
  visible = [...grid.querySelectorAll(".shot:not(.is-hidden):not(.missing)")]
    .map(f => Number(f.dataset.index));
}
function open(index){
  refreshVisible();
  pos = Math.max(0, visible.indexOf(index));
  show();
  box.classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.getElementById("lbClose").focus();
}
function show(){
  const p = PHOTOS[visible[pos]];
  if (!p) return;
  lbImg.src = p.file;
  lbImg.alt = p.name + " photographed at " + p.place;
  lbCap.innerHTML = `<span class="sp">${p.name}</span> &nbsp; ${p.place}`;
}
function step(n){ if (!visible.length) return; pos = (pos + n + visible.length) % visible.length; show(); }
function close(){ box.classList.remove("is-open"); document.body.style.overflow = ""; lbImg.src = ""; }

document.getElementById("lbClose").addEventListener("click", close);
document.getElementById("lbPrev").addEventListener("click", () => step(-1));
document.getElementById("lbNext").addEventListener("click", () => step(1));
box.addEventListener("click", e => { if (e.target === box || e.target === lbImg) close(); });
document.addEventListener("keydown", e => {
  if (!box.classList.contains("is-open")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

document.getElementById("year").textContent = new Date().getFullYear();
refreshVisible();

}
</script>
</body>
</html>
