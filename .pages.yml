media:
  - name: images
    label: Images
    input: images
    output: images
    extensions: [jpg, jpeg, png, webp]

content:
  - name: photos
    label: Photographs
    type: file
    path: content/photos.json
    format: json
    list: true
    view:
      fields: [file, name, set]
      primary: name
    fields:
      - name: file
        label: Photo
        type: image
        required: true
        options:
          media: images

      - name: name
        label: Plant name
        type: string
        required: true
        description: Shown in italics under the photograph.

      - name: place
        label: Where
        type: string
        required: true

      - name: set
        label: Collection
        type: string
        required: true
        description: >-
          Existing collections: Woodland, Autumn Colour, Detail.
          Type one of those exactly to add to it, or type a new name
          to start a new collection (it gets its own tile and filter
          button automatically).

      - name: ratio
        label: Shape
        type: select
        description: Only affects the placeholder shown before the photo is uploaded.
        options:
          values: ["4/5", "3/2", "2/3", "1/1"]
        default: "4/5"

  - name: site
    label: Site text
    type: file
    path: content/site.json
    format: json
    fields:
      - name: headline
        label: Headline (up to 3 short lines)
        type: string
        list:
          max: 3

      - name: heroEyebrow
        label: Hero eyebrow label
        type: string

      - name: heroNote
        label: Hero note
        type: text

      - name: heroCta
        label: Hero button text
        type: string

      - name: heroImage
        label: Hero image path
        type: string
        description: e.g. images/hero.jpg — the filename of the wide photo behind the headline.

      - name: heroCaption
        label: Hero image caption
        type: string
        description: Plant name shown in the bottom-right corner of the hero photo.

      - name: introLabel
        label: Intro section label
        type: string

      - name: introQuote
        label: Intro quote
        type: text

      - name: aboutTitle
        label: About heading (2 short lines, 2nd shown in italic)
        type: string
        list:
          max: 2

      - name: aboutBody
        label: About paragraphs
        type: text
        list: true

      - name: aboutGear
        label: Camera/lens line
        type: string

      - name: footerTitle
        label: Footer heading (2 short lines, 2nd shown in italic)
        type: string
        list:
          max: 2

      - name: footerBody
        label: Footer paragraph
        type: text

      - name: instagram
        label: Instagram URL
        type: string
